[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrag"
version = "0.1.0"
description = "C++ code explainer: libclang AST + LangGraph + local vLLM; bench polygon + Langfuse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langfuse>=2.0.0",
    "mlflow>=2.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    # Must match system libclang (e.g. LLVM 19 → clang 19.x on PyPI). Newer pip clang + older libclang → undefined symbols.
    "clang>=19.0.0,<20",
    "py-spy"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
astrag = "astrag.bench.cli:main"
astrag-server = "astrag.server.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/astrag"]

[tool.hatch.build.targets.sdist]
include = ["src/astrag", "README.md", "pyproject.toml", "configs", "datasets", "eval", "infra"]

[tool.ruff]
line-length = 100
target-version = "py311"
