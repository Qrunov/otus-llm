[project]
name = "ex10"
version = "0.1.0"
description = "Скрипт выборки Conceptual Captions с проверкой URL изображений"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "datasets>=2.14.0",
    "matplotlib>=3.8.0",
    "pillow>=9.0.0",
    # Текстовый токенизатор SigLIP и ряда моделей на HF (SiglipTokenizer).
    "sentencepiece>=0.2.0",
    # [image] тянет torchvision и др. — нужно для Qwen3-VL / SigLIP и др. мультимодальных моделей в ST
    "sentence-transformers[image]>=3.0.0",
    "tqdm>=4.66.0",
]

[tool.uv]
package = false
